<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG Render Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/commit-mono@5.3.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/commit-mono@5.3.0/500.css">
  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-serif: 'Lora', Georgia, serif;
      --font-mono: 'Commit Mono', ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    .og-card {
      position: relative;
      overflow: hidden;
      background: #0b0c0e;
      color: #ffffff;
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      user-select: none;
    }

    /* Horizontal: 1200 x 630 */
    .og-card--h {
      width: 1200px;
      height: 630px;
      padding: 48px 56px 44px;
    }

    /* Cuadrada: 1080 x 1080 */
    .og-card--s {
      width: 1080px;
      height: 1080px;
      padding: 64px 64px 54px;
    }

    .og-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      filter: brightness(0.96) contrast(1.05);
    }

    .og-bg-img--delicias { object-position: center 32%; }
    .og-bg-img--enrique { object-position: center 26%; }
    .og-bg-img--venecia { object-position: center 58%; }
    .og-bg-img--maricarmen { object-position: center 24%; }

    .og-velo {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(to bottom,
          rgba(0, 0, 0, 0.78) 0%,
          rgba(0, 0, 0, 0.35) 20%,
          rgba(0, 0, 0, 0) 36%
        ),
        linear-gradient(to top,
          rgba(0, 0, 0, 0.94) 0%,
          rgba(0, 0, 0, 0.84) 28%,
          rgba(0, 0, 0, 0.52) 55%,
          rgba(0, 0, 0, 0.15) 75%,
          rgba(0, 0, 0, 0) 90%
        );
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    /* Cabecera */
    .og-header {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .og-brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px 10px 12px;
      border-radius: 12px;
      background: rgba(14, 15, 18, 0.68);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    .og-brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .og-brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-left: 1px solid rgba(255, 255, 255, 0.22);
      padding-left: 14px;
    }

    .og-brand-name {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #ffffff;
    }

    .og-brand-tagline {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1;
    }

    .og-domain-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(14, 15, 18, 0.68);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.02em;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    .og-domain-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }

    /* Contenido */
    .og-content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      margin-top: auto;
      margin-bottom: 24px;
    }

    .og-category {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ffe680;
      margin-bottom: 12px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .og-title {
      font-family: var(--font-sans);
      font-weight: 700;
      letter-spacing: -0.035em;
      color: #ffffff;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95), 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    .og-card--h .og-title {
      font-size: 58px;
      line-height: 1.05;
      max-width: 980px;
    }

    .og-card--s .og-title {
      font-size: 68px;
      line-height: 1.04;
      max-width: 940px;
    }

    .og-subtitle {
      font-family: var(--font-serif);
      font-style: italic;
      color: rgba(255, 255, 255, 0.94);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .og-card--h .og-subtitle {
      font-size: 24px;
      line-height: 1.36;
      margin-top: 14px;
      max-width: 940px;
    }

    .og-card--s .og-subtitle {
      font-size: 29px;
      line-height: 1.36;
      margin-top: 20px;
      max-width: 900px;
    }

    /* Pie */
    .og-footer {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 16px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0.015em;
      white-space: nowrap;
    }

    .og-card--s .og-footer {
      font-size: 13px;
      padding-top: 20px;
    }

    .og-credit-art {
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    .og-credit-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.6);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const DATA = {
      'saldeahi': {
        img: './images/delicias.jpg',
        imgClass: 'og-bg-img--delicias',
        brandTag: 'La Administración en datos',
        domain: 'saldeahi.lopublico.es',
        category: 'Presencia institucional y redes abiertas',
        title: 'Sal de ahí',
        subtitle: 'Presencia de las instituciones públicas y representantes en X vs otras alternativas federadas.',
        creditArt: 'El jardín de las delicias, El Bosco, h. 1490 · Museo Nacional del Prado',
        creditMeta: 'Datos abiertos · CC0 1.0 Dominio Público',
      },
      'parlamentarios': {
        img: './images/enrique_iii.jpg',
        imgClass: 'og-bg-img--enrique',
        brandTag: 'La Administración en datos',
        domain: 'parlamentarios.lopublico.es',
        category: 'Transparencia y declaraciones patrimoniales',
        title: 'Las Cortes y sus bienes',
        subtitle: 'Declaraciones de bienes, patrimonio e intereses de diputados, senadores y ministros de la legislatura.',
        creditArt: 'Episodio del reinado de Enrique III de Castilla, Rodríguez de Losada, h. 1870 · Museo del Prado',
        creditMeta: 'Datos abiertos · CC0 1.0 Dominio Público',
      },
      'esrentista': {
        img: './images/venecia.jpg',
        imgClass: 'og-bg-img--venecia',
        brandTag: 'Las Cortes y sus bienes',
        domain: 'esrentista.lopublico.es',
        category: 'Fiscalización de inmuebles en alquiler',
        title: '¿Es rentista?',
        subtitle: 'Qué miembros del Gobierno, Senado o Congreso declaran rentas por alquiler.',
        creditArt: 'Venecia, Hermenegildo Estevan y Fernando, 1883 · Museo Nacional del Prado',
        creditMeta: 'Datos abiertos · CC0 1.0 Dominio Público',
      },
      'maricarmen': {
        img: './images/maricarmen.jpg',
        imgClass: 'og-bg-img--maricarmen',
        brandTag: 'La Administración en datos',
        domain: 'decretomaricarmen.lopublico.es',
        category: 'Votaciones nominales del Congreso',
        title: 'Decreto Maricarmen',
        subtitle: '¿Quién ha votado qué? Ponles cara a los 350 diputados en las votaciones del Decreto de vivienda.',
        creditArt: 'Fotografía: Retrato de Maricarmen en su hogar',
        creditMeta: 'Datos abiertos · CC0 1.0 Dominio Público',
      }
    };

    const params = new URLSearchParams(window.location.search);
    const pKey = params.get('project') || 'saldeahi';
    const format = params.get('format') || 'h'; // 'h' (1200x630) or 's' (1080x1080)
    const d = DATA[pKey] || DATA['saldeahi'];

    const isHorizontal = format === 'h';
    const cardClass = isHorizontal ? 'og-card--h' : 'og-card--s';

    document.getElementById('root').innerHTML = `
      <div class="og-card ${cardClass}" id="capture-card">
        <img src="${d.img}" alt="" class="og-bg-img ${d.imgClass}" />
        <div class="og-velo" aria-hidden="true"></div>

        <div class="og-header">
          <div class="og-brand">
            <img src="./images/logo0.png" alt="" class="og-brand-logo" />
            <div class="og-brand-text">
              <span class="og-brand-name">Lo público.</span>
              <span class="og-brand-tagline">${d.brandTag}</span>
            </div>
          </div>
          <div class="og-domain-badge">
            <span class="og-domain-dot"></span>
            <span>${d.domain}</span>
          </div>
        </div>

        <div class="og-content">
          <div class="og-category">
            <span>●</span>
            <span>${d.category}</span>
          </div>
          <h1 class="og-title">${d.title}</h1>
          <p class="og-subtitle">${d.subtitle}</p>
        </div>

        <div class="og-footer">
          <div class="og-credit-art">
            <span>${d.creditArt}</span>
          </div>
          <div class="og-credit-meta">
            <span>${isHorizontal ? d.creditMeta : 'CC0 1.0'}</span>
          </div>
        </div>
      </div>
    `;
  </script>
</body>
</html>
